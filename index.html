 const table=rows=>`<div class="scroll"><table><tr><th>Question</th><th>Student answer</th><th>Correct answer</th><th>Outcome</th></tr>${rows.map(x=>`<tr><td>${esc(x.question)}</td><td>${esc(x.student)}</td><td>${esc(x.expected)}</td><td>${x.correct?'Correct':'Incorrect'}</td></tr>`).join('')}</table></div>`;
 return `<h2>Pattern discovery / learner hypotheses</h2>${Object.entries(L.notes).map(([v,n])=>`<p><strong>${esc(v)}:</strong> ${esc(n)}</p>`).join('')||'<p>No learner hypotheses recorded in this session.</p>'}${L.attempts.length?table(L.attempts):''}<h2>Reference-access checks</h2><p class="note">Warm-up checks open the reference for one visit. They are separate from mission points and the final assessment.</p>${refs.length?table(refs):'<p>No reference-access checks submitted.</p>'}`;
}
function fresh(){return {version:1,name:'',phase:'briefing',started:null,room:null,roomDone:[],checkpoint:0,cpDone:[],active:false,index:0,part:'classify',fails:0,feedback:null,solved:false,score:0,log:[],inventory:[],unlock:false,matched:[],selected:null,assessment:{},finished:null,deduction:false,learning:newLearning(),referenceSerial:0,referenceLog:[]};}
let S=fresh(), storageOK=true, resume=null, modalTrigger=null;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s?.version===1&&s.name)resume=s;}catch{storageOK=false;}
function save(){try{if(S.name)localStorage.setItem(KEY,JSON.stringify(S));}catch{storageOK=false;} $('saveStatus').textContent=storageOK?'Progress saved on this browser only.':'Autosave unavailable — keep this tab open and download your report.';}
function announce(s){$('announcer').textContent=s;}
function currentRoom(){return BANK.rooms.find(r=>r.id===S.room);}
function currentTask(){if(S.phase==='investigate')return records(currentRoom())[S.index];if(S.phase==='infiltrate')return BANK.checkpoints[S.checkpoint].tasks[S.index];if(S.phase==='vault')return BANK.vault[S.index];return null;}
function totalTasks(){return S.phase==='investigate'?6:S.phase==='vault'?BANK.vault.length:BANK.checkpoints[S.checkpoint].tasks.length;}
function clearTask(){S.part='classify';S.fails=0;S.feedback=null;S.solved=false;S.matched=[];S.selected=null;}
function log(q,stage,student,expected,ok){S.log.push({id:q.id,phase:S.phase,stage,verb:q.verb,question:sentence(q,q.mode==='record'?q.given:'____'),student,expected,correct:ok,assisted:S.fails>0,time:new Date().toISOString()});}
function award(){S.score+=Math.max(BANK.settings.minimumPoints,BANK.settings.pointsPerChallenge-BANK.settings.errorPenalty*S.fails);S.solved=true;}
function verbHelp(q){return BANK.verbs[q.verb].rule;}
function correctLine(q){return sentence(q,answer(q));}
function setFeedback(kind,title,body,action=''){S.feedback={kind,title,body,action};save();renderTerminal();announce(title+' '+body);}
function start(name){S=fresh();S.name=name.trim().slice(0,40);S.started=Date.now();S.phase='discovery';save();render();}
function render(){ensureLearning();renderChrome();renderMap();renderInventory();renderTerminal();save();}
function renderChrome(){
 const p=S.phase, i=['briefing','discovery'].includes(p)?0:p==='investigate'?1:['infiltrate','vault'].includes(p)?2:3;
 $('stagebar').innerHTML=['Briefing','Impostor Protocol','Vault Break-In','Debrief'].map((x,n)=>`<div class="stage ${n===i?'current':n<i?'done':''}" ${n===i?'aria-current="step"':''}><b>${n<i?'✓':String(n+1).padStart(2,'0')}</b><span>${x}</span></div>`).join('')+`<div class="stats"><span><b>${S.score}</b> intel pts</span><span>${S.name?'AGENT '+esc(S.name):'AGENT —'}</span></div>`;
 const title={briefing:['Your mission awaits.','The museum is lying.','Find the impostors. Follow the clues. Steal back the truth.'],discovery:['00 / Signal lab','Find your own pattern.','Learn the disguised -ir family. Then investigate three irregular signals before the game.'],investigate:['01 / The Impostor Protocol','Trust no record.','Investigate six rooms. Repair the database. Recover the access code.'],infiltrate:['02 / The Vault Break-In','Stay one step ahead.','Outsmart five security checkpoints to reach the hidden vault.'],vault:['02 / Final vault','Six locks. One chance to save it.','Use everything you have learned to recover the Prism of Voices.'],assessment:['03 / Individual assessment','Your final transmission.','12 fresh sentences. Independent recall. Suggested time: 7 minutes.'],results:['CASE CLOSED / Debrief','The voices are safe.','The Prism is recovered. The evidence points to Curator Moreau.']}[p];
 $('chapter').textContent=title[0];$('pageTitle').textContent=title[1];$('pageSubtitle').textContent=title[2];
 $('phaseBadge').textContent=p==='investigate'?`${S.roomDone.length} / 6 ROOMS SECURED`:p==='infiltrate'?`${S.cpDone.length} / 5 CHECKPOINTS`:p==='results'?'OPERATION COMPLETE':'CLASSIFIED · LEVEL 07';
 $('manualBtn').disabled=['briefing','discovery','assessment'].includes(p);$('manualBtn').title=p==='discovery'?'Finish the signal lab before consulting the reference.':'A conjugation check is required for each lookup.';$('teacherBtn').disabled=['discovery','assessment'].includes(p);$('evidenceBtn').disabled=p==='assessment'||!S.name;
 $('intel').innerHTML=p==='investigate'?'<strong>Director’s note</strong> · Unusual does not mean wrong. Some records are authentic. Read the subject before judging the verb.':p==='infiltrate'||p==='vault'?'<strong>Mission objective</strong> · The saboteur is inside the museum. Recover the Prism before its voices are lost.':p==='assessment'?'<strong>Independent recall</strong> · Your field manual is sealed until you submit. Points earned earlier do not affect your assessment score.':'<strong>The case</strong> · Someone has corrupted the museum’s language systems. Only an agent with a sharp eye for French can get through.';
}

 const heist=['infiltrate','vault','assessment','results'].includes(S.phase), places=heist?[...BANK.checkpoints,{id:'vault',name:'Prism vault',icon:'◈',verb:'six locks'}]:BANK.rooms;
 const pos=[[7,10,37,23],[55,10,37,23],[7,41,27,25],[45,41,47,25],[7,75,37,18],[55,75,37,18]];
 $('mapTitle').textContent=heist?'Museum security / Infiltration route':'Musée des Voix / Floor plan';$('mapStatus').textContent=heist?'NIGHT SHIFT · 23:47':'DATABASE COMPROMISED';
 $('map').innerHTML=`<svg viewBox="0 0 600 480" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="#78909a" stroke-width="1.5"><path d="M35 30H565V450H35Z"/><path d="M264 102H330M123 158V198M436 158V198M206 253H270M123 317V361M438 317V361M264 405H330" stroke-dasharray="5 5"/></g><path d="M206 253H270" stroke="#ff9262" stroke-width="3"/><circle cx="239" cy="253" r="5" fill="#ff9262"/></svg>`+places.map((r,j)=>{
 const done=heist?(j<5?S.cpDone.includes(j):['assessment','results'].includes(S.phase)):S.roomDone.includes(r.id);
 const selected=heist?(S.phase==='infiltrate'&&j===S.checkpoint)||(S.phase==='vault'&&j===5):S.room===r.id;
 const enabled=heist?S.phase==='infiltrate'&&j===S.checkpoint&&j<5:S.phase==='investigate'&&!S.active&&!done;
 const a=pos[j];return `<button class="room ${done?'complete':''} ${selected?'selected':''} ${!enabled&&!done?'locked':''}" style="left:${a[0]}%;top:${a[1]}%;width:${a[2]}%;height:${a[3]}%" data-place="${j}" ${enabled?'':'disabled'} aria-label="${esc(r.name)}${done?', secured':selected?', current location':!enabled?', locked':''}"><span class="room-icon" aria-hidden="true">${done?'✓':glyph(r.id)}</span><span class="room-name">${esc(r.name)}</span><small>${done?'SECURED':heist?'0'+(j+1)+' / '+r.verb:r.verb}</small></button>`;
 }).join('')+`<span class="maplabel">N ↑ &nbsp; ${heist?'ROUTE 07 / VAULT LEVEL':'GROUND FLOOR / INVESTIGATION'}</span>`;
 $('map').querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{const j=Number(b.dataset.place);if(heist){S.active=false;}else{S.room=BANK.rooms[j].id;S.index=0;S.active=false;clearTask();}save();render();if(innerWidth<701)$('console').scrollIntoView({behavior:'smooth',block:'start'});});
}
function renderInventory(){let items=[['Agent pass',!!S.name],['Access code',S.unlock],...S.inventory.map(x=>[x,true]),['Prism of Voices',['assessment','results'].includes(S.phase)]];$('inventory').innerHTML='<span class="micro">Equipment</span>'+items.map(([name,yes])=>`<span class="item ${yes?'earned':''}">${yes?'◆':'◇'} ${name}</span>`).join('');}
function panel(title,body,meta='SECURE AGENCY TERMINAL'){return `<div class="panelbar"><span>${meta}</span><span>●</span></div><div class="console-body reveal"><h2>${title}</h2>${body}</div>`;}
function button(id,label,cls='primary full'){return `<button id="${id}" class="${cls}">${label}</button>`;}
function codeHTML(){return '<div class="code" aria-label="Access code fragments">'+BANK.rooms.map((r,i)=>`<span class="${S.roomDone.includes(r.id)?'':'empty'}">${S.roomDone.includes(r.id)?BANK.code[i]:'·'}</span>`).join('')+'</div>';}
function feedbackHTML(){const f=S.feedback;if(!f)return '';return `<div class="feedback ${f.kind==='good'?'good':''}" role="status"><b>${esc(f.title)}</b><p>${esc(f.body)}</p>${f.action?button('feedbackAction',f.action,'primary full'):''}</div>`;}
function renderTerminal(){
 const c=$('console'),p=S.phase;
 if(p==='briefing'){
 c.innerHTML=panel('We need an agent.',`<div class="mission-art" aria-hidden="true">${glyph('vault')}</div><p class="muted">At the Musée des Voix, the security records are changing. Correct French is being replaced with convincing impostors.</p><p>Find who is behind it. Infiltrate the vault. Recover the <strong>Prism of Voices</strong>.</p><form id="nameForm"><label for="agentName">YOUR AGENT NAME</label><input type="text" id="agentName" required maxlength="40" autocomplete="nickname" placeholder="Choose a name or codename">${button('start','Accept the mission <span aria-hidden="true">→</span>')}</form>${resume?button('resume','Resume Agent '+esc(resume.name),'plain full'):''}<p class="notice">One player · About 47 minutes of gameplay<br>No account needed. Works offline. Progress stays on this browser.</p>`,'INCOMING TRANSMISSION / 001');
 $('nameForm').onsubmit=e=>{e.preventDefault();const n=$('agentName').value.trim();if(n)start(n);else $('agentName').setCustomValidity('Enter a name or codename.');};$('agentName').oninput=()=>$('agentName').setCustomValidity('');if(resume)$('resume').onclick=()=>{S=resume;render();};return;
 }
 if(p==='discovery'){renderDiscovery();return;}
 if(p==='investigate'&&!S.room){
 if(S.roomDone.length===6){c.innerHTML=panel('Database restored.',`<p>Six rooms, six fragments. The catalogue points to someone inside the museum. Enter the recovered code to open the night entrance.</p>${codeHTML()}<form id="codeForm"><label for="codeInput">SECURITY ACCESS CODE · LEFT TO RIGHT</label><input id="codeInput" type="text" inputmode="numeric" maxlength="6" required autocomplete="off" placeholder="6 digits">${button('unlock','Unlock Mission 2 →')}</form><div id="codeFeedback" role="status"></div>`,'MISSION 01 / COMPLETE');$('codeForm').onsubmit=e=>{e.preventDefault();if($('codeInput').value.trim()===BANK.code.join('')){S.unlock=true;S.phase='infiltrate';S.checkpoint=0;S.active=false;S.index=0;clearTask();render();}else{$('codeFeedback').innerHTML='<div class="feedback"><b>Access denied.</b>Read the six fragments from left to right. Each digit came from a secured room.</div>';}};return;}
 c.innerHTML=panel('Choose your next lead.',`<p class="muted">Select any unexplored room on the floor plan. Each contains six records. Some are authentic; others contain a corrupted verb.</p><button class="object" id="firstRoom"><span class="symbol">⌖</span><span><strong>Investigate a room</strong><small>Follow the floor plan or take the next lead</small></span><span class="arrow">→</span></button><p class="micro">SECURITY CODE / RECOVERED FRAGMENTS</p>${codeHTML()}<p class="notice">Correct first attempts earn 10 intel points. Repairs after support earn fewer points. Mistakes never end the mission.</p>`,'MISSION 01 / CASE BOARD');$('firstRoom').onclick=()=>{S.room=BANK.rooms.find(r=>!S.roomDone.includes(r.id)).id;S.index=0;S.active=false;clearTask();render();};return;
 }
 if(p==='investigate'&&!S.active){const r=currentRoom();c.innerHTML=panel(r.name,`<p class="muted">A corrupted ${esc(r.verb)} record was reported here. Inspect the object to trace the sabotage.</p><button class="object" id="inspect"><span class="symbol">${glyph(r.id)}</span><span><strong>${r.object}</strong><small>Inspect 6 records · distinguish truth from impostors</small></span><span class="arrow">→</span></button><p class="notice">Judge only the highlighted verb. If it is corrupted, type the correct present-tense form. The subject is your first clue.</p>`,'ROOM '+String(BANK.rooms.indexOf(r)+1).padStart(2,'0')+' / EVIDENCE OBJECT');$('inspect').onclick=()=>{S.active=true;render();};return;}
 if(p==='infiltrate'&&!S.active){const cp=BANK.checkpoints[S.checkpoint];c.innerHTML=panel(cp.name,`<p class="muted">${cp.story}</p><button class="object" id="inspect"><span class="symbol">${glyph(cp.id)}</span><span><strong>${cp.object}</strong><small>Interact to bypass this checkpoint</small></span><span class="arrow">→</span></button><p class="micro">REWARD / ${cp.item}</p><p class="notice">Try recalling the pattern first. Each Field manual lookup requires a short conjugation check.</p>`,'CHECKPOINT '+(S.checkpoint+1)+' / 5');$('inspect').onclick=()=>{S.active=true;render();};return;}
 if(p==='vault'&&!S.deduction){renderDeduction();return;}
 if(p==='assessment'){renderAssessment();return;}
 if(p==='results'){renderResults();return;}
 renderQuestion();
}
function renderQuestion(){
 const q=currentTask(),expected=answer(q), record=q.mode==='record', f=S.feedback;
 let body=`<div class="taskmeta"><span>${record?'Record':S.phase==='vault'?'Vault lock':'Security sequence'} ${S.index+1} / ${totalTasks()}</span><span lang="fr">${q.verb}</span></div>`;
 if(record){body+=`<div class="sentence" lang="fr">${sentence(q,'<strong>'+esc(q.given)+'</strong>')}</div>`;if(S.part==='classify'&&!S.solved){body+='<p class="muted">Is the highlighted conjugation authentic or corrupted?</p><div class="actions">'+button('authentic','✓ Authentic','option')+button('corrupted','⌁ Corrupted','option')+'</div>';}
 else if(S.part==='repair'&&!S.solved){body+=`<p class="muted">Repair the highlighted verb. Type only its correct conjugation.</p>`+typeForm(q);}}
 else if(q.mode==='match'){body+=`<p class="muted">Reconnect the door’s wires: select a subject, then its matching form of <span lang="fr">ouvrir</span>.</p><div class="matching">`+q.pairs.map((pair,i)=>`<button class="option ${S.matched.includes(i)?'matched':S.selected===i?'chosen':''}" data-subject="${i}" ${S.matched.includes(i)?'disabled':''}>${esc(BANK.subjects[pair.p])}${S.matched.includes(i)?' ✓':''}</button><button class="option ${S.matched.includes([2,0,1][i])?'matched':''}" data-form="${[2,0,1][i]}" ${S.matched.includes([2,0,1][i])?'disabled':''}>${esc(BANK.verbs[q.verb].forms[q.pairs[[2,0,1][i]].p])}</button>`).join('')+'</div>';}
 else {body+=`<div class="sentence" lang="fr">${sentence(q,'<span class="blank">…</span>')}</div>`;if(!S.solved){if(q.mode==='decode'){body+=`<p class="muted">Use A = 1, B = 2 … Z = 26 to decode the missing verb.</p><div class="cipher" aria-label="Encrypted verb">${Array.from(expected).map(c=>c.charCodeAt(0)-96).join(' · ')}</div><details><summary class="subtle">Show the cipher alphabet</summary><p class="key">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map((c,i)=>c+'='+String(i+1)).join(' · ')}</p></details>`;}
 if(q.mode==='choice'&&!S.guided){body+='<p class="muted">Choose the conjugation that completes your transmission.</p><div class="options">'+q.choices.map(x=>`<button class="option" data-choice="${esc(x)}" lang="fr">${esc(x)}</button>`).join('')+'</div>';}
 else body+=typeForm(q);}}
 if(S.solved)body+=`<div class="feedback good"><b>${q.mode==='match'?'Wires reconnected.':'Signal verified.'}</b><p lang="fr">${q.mode==='match'?q.pairs.map(x=>esc(sentence(x,BANK.verbs[q.verb].forms[x.p]))).join('<br>'):esc(correctLine(q))}</p><p style="margin-top:8px">${esc(verbHelp(q))}</p></div>${button('next',S.index+1===totalTasks()?(S.phase==='vault'?'Recover the Prism →':'Collect the evidence →'):'Next '+(record?'record':'sequence')+' →')}`;
 else body+=feedbackHTML();
 $('console').innerHTML=`<div class="panelbar"><span>${S.phase==='investigate'?currentRoom().object:S.phase==='vault'?'PRISM VAULT / SIX-VERB LOCK':BANK.checkpoints[S.checkpoint].object}</span><span>${S.phase==='vault'?'FINAL':'LIVE'}</span></div><div class="progress" aria-label="Current sequence progress"><div style="width:${(S.index+(S.solved?1:0))/totalTasks()*100}%"></div></div><div class="console-body reveal">${body}</div>`;
 if($('authentic'))$('authentic').onclick=()=>classify(true);if($('corrupted'))$('corrupted').onclick=()=>classify(false);
 if($('answerForm'))$('answerForm').onsubmit=e=>{e.preventDefault();submitAnswer($('answerInput').value);};
 document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>submitAnswer(b.dataset.choice));
 document.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>{S.selected=Number(b.dataset.subject);S.feedback=null;save();renderQuestion();});
 document.querySelectorAll('[data-form]').forEach(b=>b.onclick=()=>matchAnswer(Number(b.dataset.form)));
 if($('next'))$('next').onclick=nextQuestion;
 if($('feedbackAction'))$('feedbackAction').onclick=()=>{const a=f.action;if(a==='Repair this record →'){S.part='repair';S.feedback=null;}else if(a==='Acknowledge authentic record →'){award();S.feedback=null;}else if(a==='Type the model to restore the system →'){S.part=record?'repair':S.part;S.feedback=null;S.guided=true;}render();if($('answerInput'))$('answerInput').focus();};
}
function typeForm(q){return `<form id="answerForm"><label for="answerInput">${S.guided?'MODEL: '+esc(answer(q))+' · RETYPE TO RESTORE':'PRESENT TENSE · VERB FORM ONLY'}</label><input type="text" id="answerInput" required autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="${q.verb==='découvrir'?'Include the accent é':'Type the missing verb'}" aria-describedby="inputHelp"><div id="inputHelp" class="notice">Case and extra spaces are ignored. Accents count.</div>${q.verb==='découvrir'?'<div class="chips"><button class="chip" type="button" id="accent" onclick="insertAccent()">é</button><span class="notice">Tap to insert</span></div>':''}${button('verify','Verify signal →')}</form>`;}
function insertAccent(){const x=$('answerInput');const i=x.selectionStart??x.value.length;const j=x.selectionEnd??i;x.value=x.value.slice(0,i)+'é'+x.value.slice(j);x.focus();x.setSelectionRange(i+1,i+1);}
function classify(authentic){if(S.solved||S.feedback?.action)return;const q=currentTask(),valid=q.given===answer(q),ok=authentic===valid;log(q,'identify',authentic?'Authentic':'Corrupted',valid?'Authentic':'Corrupted',ok);if(ok&&valid){award();S.feedback=null;render();announce('Authentic record verified. '+verbHelp(q));}else if(ok){S.part='repair';S.feedback=null;save();renderQuestion();announce('Corruption identified. Now repair the verb.');}else{S.fails++;setFeedback('bad','Review the evidence.',`${valid?'This record is authentic.':'This record is corrupted.'} ${correctLine(q)} ${verbHelp(q)}`,valid?'Acknowledge authentic record →':'Repair this record →');}}
function submitAnswer(value){if(S.solved||S.feedback?.action)return;const q=currentTask(),ok=norm(value)===norm(answer(q));log(q,q.mode==='record'?'repair':'recall',value,answer(q),ok);if(ok){award();S.feedback=null;S.guided=false;render();announce('Signal verified. '+correctLine(q));}else{S.fails++;if(S.fails>=BANK.settings.modelAfterErrors){setFeedback('bad','Restoration protocol activated.',`Model: ${correctLine(q)} ${verbHelp(q)} Read it, then retype the correct form.`, 'Type the model to restore the system →');}else{setFeedback('bad','The system needs a correction.',`Look at the subject: ${BANK.subjects[q.p]}. ${verbHelp(q)}${q.verb==='découvrir'?' You can insert é using the accent button.':''}`);} } }
function matchAnswer(i){if(S.solved||S.feedback?.action)return;const q=currentTask();if(S.selected===null){setFeedback('bad','Select a subject first.','Tap a subject in the left column, then its conjugation on the right.');return;}const j=S.selected, pair=q.pairs[j],expected=BANK.verbs[q.verb].forms[pair.p],given=BANK.verbs[q.verb].forms[q.pairs[i].p];log({...q,id:q.id+'-'+j,s:pair.s,p:pair.p},'match',given,expected,i===j);if(i===j){S.matched.push(j);S.selected=null;S.feedback={kind:'good',title:'Wire connected.',body:sentence(pair,expected),action:''};if(S.matched.length===q.pairs.length){award();S.feedback=null;}save();renderQuestion();renderChrome();}else{S.fails++;setFeedback('bad','Wrong wire. Circuit paused.',`${BANK.subjects[pair.p]} → ${expected}. ${verbHelp(q)} Select that subject and reconnect its correct wire.`);} }
function nextQuestion(){if(!S.solved)return;S.index++;clearTask();S.guided=false;if(S.index>=totalTasks())completeLocation();else render();}
function completeLocation(){
 if(S.phase==='investigate'){const r=currentRoom(),idx=BANK.rooms.indexOf(r);S.roomDone.push(r.id);S.room=null;S.active=false;S.index=0;save();render();openModal('Evidence recovered',`<div class="eyebrow">${esc(r.name)} / SECURED</div><p>${esc(r.clue)}</p><div class="sentence">CODE FRAGMENT ${idx+1}: <strong>${BANK.code[idx]}</strong></div><p class="muted">All six records in this room are restored. Return to the floor plan to follow your next lead.</p>${button('modalContinue','Return to case board →')}`);$('modalContinue').onclick=closeModal;
 }else if(S.phase==='infiltrate'){const cp=BANK.checkpoints[S.checkpoint];S.cpDone.push(S.checkpoint);S.inventory.push(cp.item);S.checkpoint++;S.index=0;S.active=false;if(S.checkpoint===5){S.phase='vault';S.active=true;}save();render();openModal('Checkpoint bypassed.',`<p>${cp.success}</p><div class="sentence" style="color:var(--lime)">+ ${cp.item}</div>${button('modalContinue',S.phase==='vault'?'Approach the vault →':'Move to the next checkpoint →')}`);$('modalContinue').onclick=closeModal;
 }else if(S.phase==='vault'){S.phase='assessment';S.index=0;render();openModal('The Prism is yours.',`<p>The vault opens. The Prism fills the room with the museum’s lost voices. Your evidence exposes Curator Moreau, who tried to steal it by corrupting the security system.</p><p><strong>One last transmission:</strong> complete 12 new sentences independently. Your manual is sealed during this final assessment. Submit once to see your results and corrections.</p>${button('modalContinue','Begin individual assessment →')}`);$('modalContinue').onclick=closeModal;}
}
function renderAssessment(){
 $('console').innerHTML=panel('Agent proficiency check.',`<p class="muted">Type the present-tense form in each gap. Write only the verb. You can review all 12 answers before submitting. No hints or corrections appear until then.</p><form id="assessmentForm"><div class="assessment-list">${BANK.assessment.map((q,i)=>`<div class="assessment-item"><label for="final-${i}">${i+1}. <span lang="fr">${esc(sentence(q,'____'))}</span> <span class="micro">(${q.verb})</span></label><input id="final-${i}" data-final="${q.id}" type="text" required autocomplete="off" autocapitalize="none" spellcheck="false" value="${esc(S.assessment[q.id]||'')}" aria-label="Question ${i+1}: ${esc(sentence(q,'blank'))} Verb ${q.verb}"></div>`).join('')}</div><p class="notice">Need an accented character? Copy this: <span lang="fr">é</span>. Accents count.</p>${button('submitFinal','Submit final transmission →')}</form>`,'FINAL ASSESSMENT / 12 SENTENCES');
 document.querySelectorAll('[data-final]').forEach(x=>x.oninput=()=>{S.assessment[x.dataset.final]=x.value;save();});
 $('assessmentForm').onsubmit=e=>{e.preventDefault();BANK.assessment.forEach(q=>{const v=S.assessment[q.id]||'';log(q,'assessment',v,answer(q),norm(v)===norm(answer(q)));});S.finished=Date.now();S.phase='results';save();render();window.scrollTo({top:0,behavior:'smooth'});};
}
function assessmentRows(){return S.log.filter(x=>x.stage==='assessment');}
function metrics(verb,phase){const arr=S.log.filter(x=>(!verb||x.verb===verb)&&(!phase||x.phase===phase));const first=new Map();arr.forEach(x=>{const k=x.id+'-'+x.stage;if(!first.has(k))first.set(k,x);});const xs=[...first.values()];return {correct:xs.filter(x=>x.correct).length,total:xs.length,attempts:arr.length};}
function renderResults(){const rows=assessmentRows(),n=rows.filter(x=>x.correct).length;
 $('console').innerHTML=panel('Mission accomplished, '+esc(S.name)+'.',`<p class="muted">Your evidence secured the museum and exposed Moreau. Here is your individual recall result.</p><div class="result-grid"><article><div class="result-number">${n}<span style="font-size:22px"> / 12</span></div><div class="micro">Assessment correct</div></article><article><div class="result-number">${S.score}</div><div class="micro">Mission intel points</div></article></div>${Object.keys(BANK.verbs).map(v=>{const a=rows.filter(x=>x.verb===v),ok=a.filter(x=>x.correct).length;return `<div class="verbresult"><strong lang="fr">${v}</strong><span>${ok} / ${a.length} assessment · ${metrics(v).correct}/${metrics(v).total} first attempts overall</span><div class="verbbar"><i style="width:${ok/a.length*100}%"></i></div></div>`;}).join('')}<p class="notice">Intel points reward mission completion. Assessment measures first responses independently; each verb has two questions.</p><div class="actions">${button('download','Download report ↓','primary')}${button('review','Review answers','plain')}</div>${button('replay','New operation / replay','plain full')}<p class="notice">Debrief: Which three -ir verbs use -er endings? What makes <span lang="fr">vous dites</span> unusual?</p>`,'CASE CLOSED / INDIVIDUAL DOSSIER');
 $('download').onclick=downloadReport;$('review').onclick=()=>openModal('Final transmission: corrections',`<p class="muted">Review your answers and the correct forms. Your original assessment result is preserved.</p>${rows.map((x,i)=>`<div class="feedback ${x.correct?'good':''}"><b>${i+1}. ${x.correct?'Correct':'Review'} · ${x.verb}</b><p lang="fr">${esc(x.question)}</p><p>Your answer: <strong>${esc(x.student||'(blank)')}</strong><br>Correct form: <strong lang="fr">${esc(x.expected)}</strong></p><p class="notice">${esc(BANK.verbs[x.verb].rule)}</p></div>`).join('')}`);$('replay').onclick=()=>{openModal('Start a new operation?',`<p>Download the current report before starting again. A new operation replaces the progress saved on this browser.</p><div class="actions">${button('saveBeforeReplay','Download report','plain')}${button('confirmReplay','Start new operation','primary')}</div>`);$('saveBeforeReplay').onclick=downloadReport;$('confirmReplay').onclick=()=>{closeModal();resume=null;S=fresh();try{localStorage.removeItem(KEY);}catch{}render();};};
}
function openModal(title,body){modalTrigger=document.activeElement;$('modalRoot').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1"><button class="plain close" id="closeModal" aria-label="Close dialog">✕</button><h2 id="modalTitle">${title}</h2>${body}</section></div>`;$('closeModal').onclick=closeModal;document.querySelector('.modal').focus();}
function closeModal(){activeReference=null;$('modalRoot').innerHTML='';if(modalTrigger?.isConnected)modalTrigger.focus();}
document.addEventListener('keydown',e=>{const m=document.querySelector('.modal');if(!m)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const f=[...m.querySelectorAll('button,a,input,select,summary,[tabindex="0"]')].filter(x=>!x.disabled);if(!f.length){e.preventDefault();return;}const a=f[0],b=f[f.length-1];if(e.shiftKey&&(document.activeElement===a||document.activeElement===m)){e.preventDefault();b.focus();}else if(!e.shiftKey&&(document.activeElement===b||document.activeElement===m)){e.preventDefault();a.focus();}}});
function showManual(){openModal('Field manual / le présent',`<div class="access-granted micro">ACCESS GRANTED / CLOSE TO RESEAL</div><p>Read the subject first. Type only the missing verb. These forms also apply to other subjects: <span lang="fr">on → il; les agents → ils; les élèves → ils/elles</span>.</p><div class="scrolltable"><table lang="fr"><thead><tr><th>Subject</th>${Object.keys(BANK.verbs).map(v=>'<th>'+v+'</th>').join('')}</tr></thead><tbody>${BANK.subjects.map((p,i)=>`<tr><th>${p}</th>${Object.values(BANK.verbs).map(v=>'<td>'+v.forms[i]+'</td>').join('')}</tr>`).join('')}</tbody></table></div><p><strong style="color:var(--lime)">The disguise:</strong> ouvrir, offrir and découvrir end in -ir, but use -er present endings: <strong>-e, -es, -e, -ons, -ez, -ent</strong>.</p><p><strong style="color:var(--orange)">The exception:</strong> vous dites. Do not write « vous disez ».</p><p>Use <span lang="fr">j’</span> before a vowel: <span lang="fr">j’écris, j’ouvre, j’offre</span>. Keep the accent in <span lang="fr">découvrir</span>.</p><details><summary>All six grammar explanations</summary>${Object.entries(BANK.verbs).map(([v,x])=>`<p><strong>${v}:</strong> ${x.rule}</p>`).join('')}</details>`);}
function resolvedBank(){return [...BANK.patternLabs.flatMap(x=>x.tasks),...BANK.rooms.flatMap(records),...BANK.checkpoints.flatMap(x=>x.tasks.flatMap(q=>q.mode==='match'?q.pairs.map((p,i)=>({...q,...p,id:q.id+'-'+i,mode:'match'})):[q])),...BANK.vault,...BANK.assessment.map(x=>({...x,mode:'assessment'}))];}

function evidence(){if(S.phase==='assessment')return;openModal('Agent’s evidence notebook',`<p class="muted">Follow the evidence. The code fragments are always arranged in floor-plan order.</p>${codeHTML()}${BANK.rooms.filter(r=>S.roomDone.includes(r.id)).map(r=>`<div class="feedback good"><b>${esc(r.name)}</b><p>${esc(r.clue)}</p></div>`).join('')||'<p>No evidence collected yet. Investigate a room to find your first lead.</p>'}${S.cpDone.map(i=>`<div class="feedback"><b>${BANK.checkpoints[i].name}</b><p>${BANK.checkpoints[i].success}</p></div>`).join('')}`);}
function renderDeduction(){
 $('console').innerHTML=panel('Name the impostor.',`<p class="muted">Before you open the vault, seal your evidence file. Which suspect ordered the sabotage?</p><div class="feedback"><b>Evidence recovered</b><p>The gift carried the chief curator’s mark. A star chart hid the initials A.M. A maintenance badge named A. Moreau. The transfer order carried the same signature.</p></div><div style="margin-top:15px">${[['moreau','A. Moreau','Chief curator · controls the museum records'],['bernard','L. Bernard','Night guard · patrols the galleries'],['simon','C. Simon','Archivist · restores old documents']].map(([id,name,role])=>`<button class="object" data-suspect="${id}"><span class="symbol">◉</span><span><strong>${name}</strong><small>${role}</small></span><span class="arrow">?</span></button>`).join('')}</div><div id="deductionFeedback" role="status"></div>`,'FINAL DEDUCTION / EVIDENCE FILE');
 document.querySelectorAll('[data-suspect]').forEach(b=>b.onclick=()=>{if(b.dataset.suspect==='moreau'){S.deduction=true;save();render();announce('Deduction confirmed. Open the six vault locks.');}else{$('deductionFeedback').innerHTML='<div class="feedback"><b>Recheck the evidence.</b>The initials A.M. and the chief curator’s mark point to A. Moreau. Connect both clues before sealing your file.</div>';}});
}

function showTeacher(){openModal('Teacher HQ',`<p class="muted">A 60-minute Grade 7 lesson. Teach ouvrir, offrir and découvrir first. Students then observe lire, écrire and dire, write their own hypotheses, and test them before either mission.</p><p>Each reference lookup, including this answer bank, requires a correctly answered regular-verb check. The full reference is sealed during the signal lab and final assessment.</p><div class="scrolltable"><table><tr><th>Activity</th><th>Minutes</th></tr><tr><td>Teach the disguised -ir family; observe, hypothesise and test three irregular patterns</td><td>8</td></tr><tr><td>Mission 1: six rooms × six records</td><td>17</td></tr><tr><td>Mission 2: five checkpoints, then the six-lock vault</td><td>23</td></tr><tr><td>Individual assessment: 12 typed responses</td><td>7</td></tr><tr><td>Debrief; download individual reports</td><td>5</td></tr></table></div><p><strong>Pacing:</strong> suggested times are guidance, not forced timers. Pause for discussion or continue at your own pace. The heist has 22 checkpoint responses (including 3 wire matches) and 6 vault responses.</p><p><strong>Feedback:</strong> every submission is logged. A wrong classification reveals the correct analysis; corrupt forms still require a typed repair. For typed and selected responses, repeated errors require retyping a worked model. A wrong wire match reveals the correct subject–verb connection. Progress never advances on an incorrect response.</p><p><strong>Scoring:</strong> each completed mission challenge earns 10 points minus 3 per error, minimum 2. The three-wire puzzle is one 10-point challenge. The 12-question assessment is scored separately.</p><p><strong>Privacy:</strong> names, answers and progress stay in this browser’s local storage. Use codenames on shared devices. Report downloads are local HTML files. Starting a new operation replaces the saved session.</p><p><strong>Adapt the engine:</strong> edit the <code>BANK</code> object in this HTML file. It holds forms, sentences, pattern labs, reference-access checks, suspects, objects, tasks, assessment data, and difficulty settings (error threshold and point values). The resolved key below is generated from that data.</p><details><summary>Question bank & answer key (${resolvedBank().length} prompts)</summary><p>Mission 1 access code: <strong>${BANK.code.join('')}</strong>. Culprit: Curator A. Moreau.</p><div class="scrolltable"><table><thead><tr><th>ID / type</th><th>Prompt</th><th>Answer / status</th></tr></thead><tbody>${resolvedBank().map(q=>`<tr><td>${esc(q.id)}<br>${q.mode}</td><td lang="fr">${esc(sentence(q,q.given||'____'))}</td><td lang="fr">${esc(answer(q))}${q.mode==='record'?'<br>'+ (q.given===answer(q)?'Authentic':'Corrupted'):''}</td></tr>`).join('')}</tbody></table></div></details><div class="actions">${button('bankDownload','Download question bank JSON','plain')}${S.name?button('partialReport','Download progress report','plain'):''}</div>`);$('bankDownload').onclick=()=>download(JSON.stringify({BANK,resolvedKey:resolvedBank().map(q=>({...q,correctAnswer:answer(q)}))},null,2),'verb-heist-question-bank.json','application/json');if($('partialReport'))$('partialReport').onclick=downloadReport;}
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function reportHTML(){const rows=assessmentRows(),score=rows.filter(x=>x.correct).length;return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verb Heist report · ${esc(S.name)}</title><style>body{font:15px/1.5 system-ui,sans-serif;color:#172632;max-width:1120px;margin:35px auto;padding:20px}h1{font:36px Georgia,serif}table{width:100%;border-collapse:collapse;font-size:13px;margin:20px 0}td,th{padding:9px;border:1px solid #b9c4c8;text-align:left}th{background:#eaf0e5}.yes{color:#2b672d}.no{color:#a53a24}.note{color:#526572}.scroll{overflow-x:auto}@media print{body{margin:0;padding:0}tr{break-inside:avoid}h2{break-after:avoid}}</style></head><body><p>FRENCH SPY ACADEMY / INDIVIDUAL DOSSIER</p><h1>Operation Verb Heist</h1><p><strong>Agent:</strong> ${esc(S.name)}<br><strong>Report generated:</strong> ${esc(new Date().toLocaleString())}<br><strong>Status:</strong> ${S.phase==='results'?'Completed':'In progress: '+esc(S.phase)}<br><strong>Elapsed:</strong> ${S.started?Math.round(((S.finished||Date.now())-S.started)/60000):0} minutes (includes time with the tab closed)<br><strong>Mission points:</strong> ${S.score}<br><strong>Final independent assessment:</strong> ${rows.length?score+' / '+rows.length:'Not submitted'}</p><p class="note">First-attempt performance counts the first response to each question stage (identification, repair, matching or recall). All attempts are preserved below. Mission points reward completion and supported practice; assessment scores are separate.</p><h2>Performance by verb</h2><div class="scroll"><table><tr><th>Verb</th><th>Investigation first attempts</th><th>Heist + vault first attempts</th><th>Assessment</th><th>Total submissions</th></tr>${Object.keys(BANK.verbs).map(v=>{const a=metrics(v,'investigate'),b=metrics(v,'infiltrate'),c=metrics(v,'vault'),d=rows.filter(x=>x.verb===v);return `<tr><th>${v}</th><td>${a.correct}/${a.total}</td><td>${b.correct+c.correct}/${b.total+c.total}</td><td>${d.filter(x=>x.correct).length}/${d.length}</td><td>${metrics(v).attempts}</td></tr>`;}).join('')}</table></div><h2>Question & answer history</h2><p class="note">Each row is one submitted response. “Support” means an earlier error had triggered feedback in that challenge. Full present-tense sentences and grammar explanations follow.</p><div class="scroll"><table><thead><tr><th># / phase</th><th>Question</th><th>Student answer</th><th>Correct answer</th><th>Outcome</th></tr></thead><tbody>${S.log.map((x,i)=>`<tr><td>${i+1}. ${esc(x.phase)}<br>${esc(x.id)} / ${esc(x.stage)}</td><td lang="fr">${esc(x.question)}</td><td lang="fr">${esc(x.student)}</td><td lang="fr">${esc(x.expected)}</td><td class="${x.correct?'yes':'no'}">${x.correct?'Correct':'Incorrect'}${x.assisted?'<br>Support':''}</td></tr>`).join('')}</tbody></table></div>${learningReportHTML()}<h2>Grammar for review</h2>${Object.entries(BANK.verbs).map(([v,b])=>`<p><strong>${v}:</strong> ${b.forms.join(', ')}.<br>${esc(b.rule)}</p>`).join('')}<h2>Debrief</h2><p>Ouvrir, offrir and découvrir use -e, -es, -e, -ons, -ez, -ent in the present tense. Dire has the special form vous dites.</p><p class="note">This report was generated locally by the standalone game. No student data was uploaded. Print this page or use your browser’s Print → Save as PDF.</p></body></html>`;}
function downloadReport(){download(reportHTML(),'verb-heist-'+(S.name.replace(/[^a-zA-Z0-9_-]/g,'-')||'agent')+'-report.html','text/html;charset=utf-8');}
$('manualBtn').onclick=manual;$('teacherBtn').onclick=teacher;$('evidenceBtn').onclick=evidence;
render();
</script>
